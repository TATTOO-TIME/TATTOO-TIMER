const $=id=>document.getElementById(id);const DB_NAME='tattoo_timer_recordings_v1',STORE='videos';let db=null,realMode=false,stream=null,mediaRecorder=null,chunks=[],isRecording=false,facingMode='environment',clockInterval=null,recordingSavePromise=null;
let stopwatchInterval=null,stopwatchRunning=false,stopwatchElapsed=0,stopwatchStarted=0;let clockRunning=true;let memoKey='melos_memos';let timerInterval=null,timerRunning=false,timerRemaining=3600,audioContext=null;
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')};function pad(n){return String(n).padStart(2,'0')};function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}

function toggleStopwatch(){if(stopwatchRunning){stopwatchElapsed+=Date.now()-stopwatchStarted;stopwatchRunning=false;clearInterval(stopwatchInterval);$('stopwatchToggle').textContent='再開'}else{stopwatchStarted=Date.now();stopwatchRunning=true;$('stopwatchToggle').textContent='停止';stopwatchInterval=setInterval(renderStopwatch,50)}}function resetStopwatch(){stopwatchRunning=false;stopwatchElapsed=0;clearInterval(stopwatchInterval);$('stopwatchToggle').textContent='開始';renderStopwatch()}
function renderTimer(){$('timerValue').textContent=`${pad(Math.floor(timerRemaining/60))}:${pad(timerRemaining%60)}`;if($('modeTimer').classList.contains('active'))showDigital(`${pad(Math.floor(timerRemaining/60))}:${pad(timerRemaining%60)}`)}function resetTimer(){timerRunning=false;timerRemaining=3600;clearInterval(timerInterval);$('timerToggle').textContent='開始';renderTimer()}function prepareAudio(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;audioContext=audioContext||new C;audioContext.resume();return audioContext}function playAlarm(){const c=prepareAudio();if(!c)return;[0,.35,.7].forEach((d,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=i===1?1046.5:880;g.gain.setValueAtTime(.001,c.currentTime+d);g.gain.exponentialRampToValueAtTime(.28,c.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d+.25);o.connect(g).connect(c.destination);o.start(c.currentTime+d);o.stop(c.currentTime+d+.27)})}function toggleTimer(){if(timerRunning){timerRunning=false;clearInterval(timerInterval);$('timerToggle').textContent='再開';return}if(timerRemaining<=0)resetTimer();prepareAudio();timerRunning=true;$('timerToggle').textContent='停止';timerInterval=setInterval(()=>{timerRemaining--;renderTimer();if(timerRemaining<=0){timerRunning=false;clearInterval(timerInterval);$('timerToggle').textContent='開始';playAlarm();toast('タイマー終了')}},1000)}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}function txStore(mode){return db.transaction(STORE,mode).objectStore(STORE)}function saveVideo(rec){return new Promise((res,rej)=>{const r=txStore('readwrite').put(rec);r.onsuccess=res;r.onerror=()=>rej(r.error)})}function getVideos(){return new Promise((res,rej)=>{const r=txStore('readonly').getAll();r.onsuccess=()=>res((r.result||[]).sort((a,b)=>b.created-a.created));r.onerror=()=>rej(r.error)})}function deleteVideo(id){return new Promise((res,rej)=>{const r=txStore('readwrite').delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)})}function clearVideos(){return new Promise((res,rej)=>{const r=txStore('readwrite').clear();r.onsuccess=res;r.onerror=()=>rej(r.error)})}
async function renderLibrary(){const list=$('recordingsList');list.innerHTML='';const rows=await getVideos();if(!rows.length){list.innerHTML='<div class="empty">🎬<br><br>録画はまだありません</div>';return}rows.forEach(row=>{const card=document.createElement('article');card.className='record-card';const date=new Date(row.created).toLocaleString('ja-JP');const ext=(row.ext||((row.blob.type||'video/webm').includes('mp4')?'mp4':'webm'));card.innerHTML=`<div class="record-meta"><span class="record-name">録画 ${date}</span><span class="record-date">${Math.round(row.blob.size/1024)}KB</span></div><video class="record-video" controls playsinline></video><div class="record-actions"><a class="small-action download" download="tattoo-timer-${row.created}.${ext}">ダウンロード</a><button class="small-action delete">削除</button></div>`;const video=card.querySelector('video');const url=URL.createObjectURL(row.blob);video.src=url;const download=card.querySelector('.download');download.href=url;card.querySelector('.delete').onclick=async()=>{if(confirm('この動画を削除しますか？')){await deleteVideo(row.id);URL.revokeObjectURL(url);renderLibrary()}};list.appendChild(card)})}
async function stopAllMedia(){if(mediaRecorder&&mediaRecorder.state!=='inactive'){mediaRecorder.stop();if(recordingSavePromise)await recordingSavePromise}leaveCamera();recordingSavePromise=null}async function openLibrary(){await stopAllMedia();if(!db)await openDB();await renderLibrary();show('libraryScreen')}async function startCamera(){if(!realMode)return;try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode},audio:true});$('cameraVideo').srcObject=stream;$('cameraPreview').classList.remove('active');$('cameraLabel').textContent=facingMode==='user'?'FRONT':'BACK'}catch(e){toast('カメラの許可が必要です')}}async function switchCamera(){if(!realMode){return}facingMode=facingMode==='environment'?'user':'environment';await startCamera();const label=facingMode==='user'?'FRONT':'BACK';$('cameraStatus').textContent=label;$('cameraStatus').classList.add('show');clearTimeout(switchCamera.t);switchCamera.t=setTimeout(()=>$('cameraStatus').classList.remove('show'),1600);toast(label)}
async function toggleRecording(){if(!realMode){return}if(isRecording){mediaRecorder.stop();return}try{if(!stream)await startCamera();if(!stream)return;chunks=[];const candidates=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp8,opus','video/webm'];const type=candidates.find(x=>MediaRecorder.isTypeSupported(x));if(!type)throw new Error('MediaRecorder形式が未対応です');mediaRecorder=new MediaRecorder(stream,{mimeType:type});mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recordingSavePromise=new Promise(resolve=>{mediaRecorder.onstop=async()=>{try{const blob=new Blob(chunks,{type});const id=(crypto.randomUUID?crypto.randomUUID():String(Date.now()));await saveVideo({id,created:Date.now(),blob,mime:type,ext:type.includes('mp4')?'mp4':'webm'});isRecording=false;$('brandHome').classList.remove('recording');renderClock()}finally{resolve()}}});mediaRecorder.start();isRecording=true;$('brandHome').classList.add('recording')}catch(e){console.error(e);isRecording=false;$('brandHome').classList.remove('recording');toast('このiPadでは録画を開始できません')}}
function enterClock(route){realMode=route==='real';show('clockScreen');setMode('now');startClock()};function leaveCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('cameraPreview').classList.remove('active')}
document.querySelectorAll('.clock-mode').forEach(t=>t.onclick=()=>selectClockMode(t.dataset.clockMode));$('clockStart').onclick=startSelected;$('clockStop').onclick=stopSelected;$('clockReset').onclick=resetSelected;$('stopwatchToggle').onclick=toggleStopwatch;$('stopwatchReset').onclick=resetStopwatch;$('timerToggle').onclick=toggleTimer;$('timerReset').onclick=resetTimer;$('fakeStart').onclick=()=>enterClock('fake');$('realStart').onclick=()=>enterClock('real');$('brandHome').onclick=toggleRecording;$('nowLibraryLink').onclick=()=>{if(realMode)openLibrary()};$('currentDate').onclick=()=>{if(realMode&&$('modeStopwatch').classList.contains('active'))openMemos()};$('memoBack').onclick=()=>{show('clockScreen');setMode('stopwatch');startClock()};$('memoAdd').onclick=addMemo;$('memoInput').onkeydown=e=>{if(e.key==='Enter')addMemo()};$('recordingsButton').onclick=switchCamera;$('libraryBack').onclick=async()=>{await stopAllMedia();show('clockScreen');startClock()};$('closeClock').onclick=async()=>{await stopAllMedia();show('startScreen');clearInterval(clockInterval)};document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAllMedia()});window.addEventListener('pagehide',()=>{if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop();leaveCamera()});
openDB().catch(e=>console.warn('DB unavailable',e));
