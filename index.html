<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08100b">
<title>TATTOO TIMER</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#1c1c1e;background:#f2f2f7;color-scheme:light;--green:#34c759;--dark:#08100b;--blue:#007aff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f2f2f7}button{font:inherit;border:0;cursor:pointer}.screen{position:fixed;inset:0;display:none}.screen.active{display:flex}
#startScreen{align-items:center;justify-content:center;background:var(--dark);color:#fff}.start-card{text-align:center;width:min(88vw,360px)}.start-mark{font-size:58px;line-height:1;color:var(--green);margin-bottom:18px;cursor:pointer}.start-title,.brand{font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;letter-spacing:.1em}.start-title{font-size:32px;text-shadow:2px 2px 0 rgba(52,199,89,.5);margin-bottom:10px}.start-sub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#8e8e93;margin-bottom:22px}.start-button{width:100%;height:48px;border-radius:14px;background:var(--green);color:#071009;font-weight:700}
#clockScreen,#libraryScreen{flex-direction:column;background:#f2f2f7;color:#1c1c1e;opacity:1}.clock-header{height:64px;flex:0 0 64px;display:flex;align-items:center;justify-content:center;padding:0 54px;background:var(--dark);border-bottom:1px solid #203a28;position:relative}.brand{font-size:25px;color:#fff;text-shadow:2px 2px 0 rgba(52,199,89,.55);cursor:pointer}.brand.recording{color:var(--green);text-shadow:0 0 12px rgba(52,199,89,.75)}.header-button{position:absolute;width:38px;height:38px;border-radius:50%;background:#17301f;color:#fff;display:grid;place-items:center;font-size:21px}.header-button.left{left:14px}.header-button.right{right:14px}.header-button:active{transform:scale(.92)}
.clock-content{flex:1;overflow:auto;text-align:center;padding:34px 20px calc(112px + env(safe-area-inset-bottom,0px));background:#f2f2f7}.time-display{font-size:clamp(48px,15vw,72px);font-weight:300;letter-spacing:-.055em;line-height:1.1;margin:22px 0 8px;color:#1c1c1e;cursor:pointer;transition:color .2s}.time-display.recording{color:var(--green)}.date-display{color:#8e8e93;font-size:15px;margin-bottom:42px}.mode{display:none;max-width:420px;margin:0 auto}.mode.active{display:block}.mode-caption{display:inline-block;font-size:15px;color:#8e8e93;margin-bottom:8px;cursor:pointer;padding:8px 14px;border-radius:10px}.mode-caption:hover{background:#e5e5ea}.value{font-size:clamp(48px,14vw,68px);font-weight:300;letter-spacing:-.04em;margin:30px 0;color:#1c1c1e}.actions{display:flex;justify-content:center;gap:12px}.action{min-width:120px;padding:13px 20px;border-radius:12px;background:#e5e5ea;color:#1c1c1e;font-size:15px;font-weight:600}.action.primary{background:var(--blue);color:#fff}.timer-note{margin:30px 0 5px;color:#8e8e93;font-size:15px}.timer-note strong{display:block;color:#1c1c1e;font-size:17px;margin-top:7px}.bottom-tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.98);border-top:1px solid #d1d1d6}.tab{flex:1;padding:12px 6px;border-radius:10px;background:#e5e5ea;color:#3a3a3c;font-size:13px;font-weight:600}.tab.active{background:var(--blue);color:#fff}
.library-content{flex:1;overflow:auto;padding:18px 16px calc(30px + env(safe-area-inset-bottom,0px));background:#f2f2f7}.library-title{font-size:22px;font-weight:700;margin:4px 4px 4px}.library-sub{font-size:13px;color:#8e8e93;margin:0 4px 18px}.empty{text-align:center;color:#8e8e93;padding:70px 20px}.record-card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #00000016}.record-meta{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}.record-name{font-weight:600}.record-date{font-size:12px;color:#8e8e93}.record-video{width:100%;max-height:280px;background:#000;border-radius:10px;display:block}.record-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.small-action{padding:9px 13px;border-radius:9px;background:#e5e5ea;font-size:13px;font-weight:600}.small-action.delete{color:#ff3b30}.camera-preview{position:fixed;inset:0;background:#000;z-index:30;display:none}.camera-preview.active{display:block}.camera-preview video{width:100%;height:100%;object-fit:cover}.camera-label{position:absolute;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:8px 14px;border-radius:20px;background:#000a;color:#fff;font-size:13px}.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(12px);padding:10px 15px;border-radius:12px;background:rgba(28,28,30,.9);color:#fff;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="screen active" id="startScreen"><div class="start-card"><div class="start-mark" id="realStart" role="button" aria-label="リアルモード起動">◷</div><div class="start-title">TATTOO TIMER</div><div class="start-sub">start to continue</div><button class="start-button" id="fakeStart">Start</button></div></section>
<section class="screen" id="clockScreen"><header class="clock-header"><button class="header-button left" id="cameraSwitch" aria-label="カメラ切替">✎</button><div class="brand" id="brandHome">TATTOO TIMER</div><button class="header-button right" id="recordingsButton" aria-label="録画ライブラリ">⚙</button></header><main class="clock-content"><div class="time-display" id="currentTime">00:00:00</div><div class="date-display" id="currentDate">----</div><section class="mode active" id="modeNow"><div class="mode-caption" id="nowLibraryLink">現在時刻</div></section><section class="mode" id="modeStopwatch"><div class="value" id="stopwatchValue">00:00.0</div><div class="actions"><button class="action primary" id="stopwatchToggle">開始</button><button class="action" id="stopwatchReset">リセット</button></div></section><section class="mode" id="modeTimer"><div class="timer-note">固定タイマー<strong>60分</strong></div><div class="value" id="timerValue">60:00</div><div class="actions"><button class="action primary" id="timerToggle">開始</button><button class="action" id="timerReset">リセット</button></div></section></main><nav class="bottom-tabs"><button class="tab active" data-mode="now">現在時刻</button><button class="tab" data-mode="stopwatch">ストップウォッチ</button><button class="tab" data-mode="timer">タイマー</button></nav></section>
<section class="screen" id="libraryScreen"><header class="clock-header"><button class="header-button left" id="libraryBack">‹</button><div class="brand">RECORDINGS</div><button class="header-button right" id="libraryClear" aria-label="全削除">⌫</button></header><main class="library-content"><div class="library-title">録画ライブラリ</div><div class="library-sub">保存した動画を再生・削除できます</div><div id="recordingsList"></div></main></section>
<div class="camera-preview" id="cameraPreview"><video id="cameraVideo" autoplay playsinline muted></video><div class="camera-label" id="cameraLabel"></div></div><div class="toast" id="toast"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);const DB_NAME='tattoo_timer_recordings_v1',STORE='videos';let db=null,realMode=false,stream=null,mediaRecorder=null,chunks=[],isRecording=false,facingMode='environment',clockInterval=null;
let stopwatchInterval=null,stopwatchRunning=false,stopwatchElapsed=0,stopwatchStarted=0;let timerInterval=null,timerRunning=false,timerRemaining=3600,audioContext=null;
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')};function pad(n){return String(n).padStart(2,'0')};function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function renderClock(){const d=new Date();$('currentTime').textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;$('currentDate').textContent=d.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'})};function startClock(){renderClock();clearInterval(clockInterval);clockInterval=setInterval(renderClock,1000)}
function setMode(mode){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===mode));document.querySelectorAll('.mode').forEach(m=>m.classList.remove('active'));$(`mode${mode[0].toUpperCase()+mode.slice(1)}`).classList.add('active')}
function formatStopwatch(ms){const s=Math.floor(ms/1000);return `${pad(Math.floor(s/60))}:${pad(s%60)}.${Math.floor(ms/100)%10}`}function renderStopwatch(){const e=stopwatchRunning?stopwatchElapsed+Date.now()-stopwatchStarted:stopwatchElapsed;$('stopwatchValue').textContent=formatStopwatch(e)}function toggleStopwatch(){if(stopwatchRunning){stopwatchElapsed+=Date.now()-stopwatchStarted;stopwatchRunning=false;clearInterval(stopwatchInterval);$('stopwatchToggle').textContent='再開'}else{stopwatchStarted=Date.now();stopwatchRunning=true;$('stopwatchToggle').textContent='停止';stopwatchInterval=setInterval(renderStopwatch,50)}}function resetStopwatch(){stopwatchRunning=false;stopwatchElapsed=0;clearInterval(stopwatchInterval);$('stopwatchToggle').textContent='開始';renderStopwatch()}
function renderTimer(){$('timerValue').textContent=`${pad(Math.floor(timerRemaining/60))}:${pad(timerRemaining%60)}`}function resetTimer(){timerRunning=false;timerRemaining=3600;clearInterval(timerInterval);$('timerToggle').textContent='開始';renderTimer()}function prepareAudio(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;audioContext=audioContext||new C;audioContext.resume();return audioContext}function playAlarm(){const c=prepareAudio();if(!c)return;[0,.35,.7].forEach((d,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=i===1?1046.5:880;g.gain.setValueAtTime(.001,c.currentTime+d);g.gain.exponentialRampToValueAtTime(.28,c.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d+.25);o.connect(g).connect(c.destination);o.start(c.currentTime+d);o.stop(c.currentTime+d+.27)})}function toggleTimer(){if(timerRunning){timerRunning=false;clearInterval(timerInterval);$('timerToggle').textContent='再開';return}if(timerRemaining<=0)resetTimer();prepareAudio();timerRunning=true;$('timerToggle').textContent='停止';timerInterval=setInterval(()=>{timerRemaining--;renderTimer();if(timerRemaining<=0){timerRunning=false;clearInterval(timerInterval);$('timerToggle').textContent='開始';playAlarm();toast('タイマー終了')}},1000)}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id'});r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)})}function txStore(mode){return db.transaction(STORE,mode).objectStore(STORE)}function saveVideo(rec){return new Promise((res,rej)=>{const r=txStore('readwrite').put(rec);r.onsuccess=res;r.onerror=()=>rej(r.error)})}function getVideos(){return new Promise((res,rej)=>{const r=txStore('readonly').getAll();r.onsuccess=()=>res((r.result||[]).sort((a,b)=>b.created-a.created));r.onerror=()=>rej(r.error)})}function deleteVideo(id){return new Promise((res,rej)=>{const r=txStore('readwrite').delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)})}function clearVideos(){return new Promise((res,rej)=>{const r=txStore('readwrite').clear();r.onsuccess=res;r.onerror=()=>rej(r.error)})}
async function renderLibrary(){const list=$('recordingsList');list.innerHTML='';const rows=await getVideos();if(!rows.length){list.innerHTML='<div class="empty">🎬<br><br>録画はまだありません</div>';return}rows.forEach(row=>{const card=document.createElement('article');card.className='record-card';const date=new Date(row.created).toLocaleString('ja-JP');card.innerHTML=`<div class="record-meta"><span class="record-name">録画 ${date}</span><span class="record-date">${Math.round(row.blob.size/1024)}KB</span></div><video class="record-video" controls playsinline></video><div class="record-actions"><button class="small-action delete">削除</button></div>`;const video=card.querySelector('video');video.src=URL.createObjectURL(row.blob);card.querySelector('.delete').onclick=async()=>{if(confirm('この動画を削除しますか？')){await deleteVideo(row.id);URL.revokeObjectURL(video.src);renderLibrary()}};list.appendChild(card)})}
async function openLibrary(){if(!db)await openDB();await renderLibrary();show('libraryScreen')}async function startCamera(){if(!realMode)return;try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode},audio:true});$('cameraVideo').srcObject=stream;$('cameraPreview').classList.add('active');$('cameraLabel').textContent=facingMode==='user'?'フロントカメラ':'バックカメラ'}catch(e){toast('カメラの許可が必要です')}}async function switchCamera(){if(!realMode){toast('リアルモードで使用できます');return}facingMode=facingMode==='environment'?'user':'environment';await startCamera();toast(facingMode==='user'?'フロントカメラ':'バックカメラ')}
async function toggleRecording(){if(!realMode){toast('Startはフェイクモードです');return}if(isRecording){mediaRecorder.stop();return}try{if(!stream)await startCamera();if(!stream)return;chunks=[];const type=MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':'video/webm';mediaRecorder=new MediaRecorder(stream,{mimeType:type});mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};mediaRecorder.onstop=async()=>{const blob=new Blob(chunks,{type});await saveVideo({id:crypto.randomUUID(),created:Date.now(),blob});isRecording=false;$('brandHome').classList.remove('recording');toast('録画を保存しました');renderClock()};mediaRecorder.start();isRecording=true;$('brandHome').classList.add('recording');toast('録画開始')}catch(e){console.error(e);toast('録画を開始できません')}}
function enterClock(route){realMode=route==='real';show('clockScreen');startClock();if(!realMode)toast('フェイクモード')};function leaveCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('cameraPreview').classList.remove('active')}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setMode(t.dataset.mode));$('stopwatchToggle').onclick=toggleStopwatch;$('stopwatchReset').onclick=resetStopwatch;$('timerToggle').onclick=toggleTimer;$('timerReset').onclick=resetTimer;$('fakeStart').onclick=()=>enterClock('fake');$('realStart').onclick=()=>enterClock('real');$('brandHome').onclick=toggleRecording;$('currentTime').onclick=toggleRecording;$('nowLibraryLink').onclick=openLibrary;$('recordingsButton').onclick=openLibrary;$('libraryBack').onclick=()=>{show('clockScreen');startClock()};$('libraryClear').onclick=async()=>{if(confirm('保存済み動画をすべて削除しますか？')){await clearVideos();renderLibrary()}};$('cameraSwitch').onclick=switchCamera;$('closeClock').onclick=()=>{if(isRecording)mediaRecorder.stop();leaveCamera();show('startScreen');clearInterval(clockInterval)};
openDB().catch(e=>console.warn('DB unavailable',e));
</script>
